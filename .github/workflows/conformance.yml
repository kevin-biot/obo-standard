name: conformance

on:
  pull_request:
  push:

jobs:
  conformance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install separate Node verifier dependencies
        working-directory: implementations/node
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Node verifier and shared cross-language vectors
        working-directory: implementations/node
        run: npm test

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Static conformance
        run: |
          python scripts/check_draft_version.py
          python scripts/validate_examples.py
          python -m unittest discover -s tests -v
          python examples/integrations/external-grant/demo.py --check
          ./obo verify-bundle examples/integrations/external-grant/accepted.json \
            --trust examples/integrations/external-grant/trust.json --at 1793016000
          python scripts/check_dns_fixture.py
          python -m py_compile \
            obo \
            examples/integrations/a2a/agents.py \
            examples/integrations/a2a/keygen.py \
            examples/integrations/a2a/anchor_stub/server.py
          ./obo verify examples/credentials/signed-demo.json \
            --intent "search flights from LHR to JFK on 2026-06-15" \
            --public-key m2OHbJ8-t7ch8YxL5vFU7K7ysDQfi8SJ58PDHxcc2qw

      - name: Run real PocketBase receiving-service integration
        env:
          POCKETBASE_BINARY: ${{ runner.temp }}/obo-pocketbase/pocketbase
          OBO_POCKETBASE_RESULTS: ${{ runner.temp }}/obo-pocketbase-evidence
        run: |
          python examples/integrations/pocketbase/download.py --output-dir "$RUNNER_TEMP/obo-pocketbase"
          python -m unittest discover -s tests -p test_pocketbase_live.py -v

      - name: Upload real-service test evidence
        uses: actions/upload-artifact@v4
        with:
          name: pocketbase-test-evidence
          path: ${{ runner.temp }}/obo-pocketbase-evidence
          retention-days: 7

      - name: Run real Keycloak issuer to PocketBase integration
        env:
          OBO_KEYCLOAK_LIVE: "1"
          OBO_NODE_VERIFY: "1"
          POCKETBASE_BINARY: ${{ runner.temp }}/obo-pocketbase/pocketbase
          OBO_KEYCLOAK_RESULTS: ${{ runner.temp }}/obo-keycloak-evidence
        run: python -m unittest discover -s tests -p test_keycloak_live.py -v

      - name: Upload independent-issuer test evidence
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-pocketbase-test-evidence
          path: ${{ runner.temp }}/obo-keycloak-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Run A2A reference demo
        working-directory: examples/integrations/a2a
        run: |
          python keygen.py --operator-id ci.example.test --keys-dir keys
          {
            echo "TRAVEL_AGENT_OPERATOR_ID=ci.example.test"
            echo "TRAVEL_AGENT_PRINCIPAL_ID=did:key:z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK"
            echo "TRAVEL_AGENT_PRIVATE_KEY_B64=$(base64 -w0 keys/private_key.pem)"
            echo "TRAVEL_AGENT_PUBKEY=$(cat keys/public_key.b64)"
            echo "ANCHOR_PROFILE_ID=regulated"
          } > .env
          docker compose up --build --abort-on-container-exit --exit-code-from travel-agent
